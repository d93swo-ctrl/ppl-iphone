<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PPL iPhone v1.3</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#243247;font:16px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:520px;margin:auto;padding:22px 16px 60px}h1{margin:3px 0 15px;font-size:26px}h2{font-size:19px}.sub{font-size:12px;color:#718096}.card{background:#fff;border:1px solid #e1e8f0;border-radius:17px;padding:17px;margin:14px 0;box-shadow:0 2px 9px #2030400a}.tabs,.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid{grid-template-columns:repeat(2,1fr)}button{font:inherit;border:1px solid #d7e1ec;border-radius:12px;background:#f7faff;color:#254362;padding:14px 8px;cursor:pointer;touch-action:manipulation}button.selected,.primary{background:#3171b9;color:#fff;border-color:#3171b9}button:active{opacity:.65}label{display:block;margin:12px 0 5px;font-size:13px;color:#5b6f84}input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #d4dfe9;font:16px -apple-system,sans-serif;background:#fff;color:#263548}textarea{min-height:65px}.wide{width:100%;margin-top:14px}.status{border-radius:10px;background:#e7f1fc;padding:11px;font-size:13px;color:#285785}.item{padding:12px 0;border-bottom:1px solid #edf0f4}.item:last-child{border:0}[hidden]{display:none!important}.line{display:flex;justify-content:space-between;gap:10px;align-items:center}</style></head><body><main><div class="sub">PERSONAL PERFORMANCE LAB · v1.3</div><h1>PPL iPhone</h1><div class="status" id="status">正在啟動…</div><div class="tabs" style="margin-top:14px"><button class="selected" data-tab="state">State</button><button data-tab="work">工作</button><button data-tab="records">紀錄</button></div>
<section id="state"><div class="card"><h2>快速記錄</h2><div class="grid"><button class="selected" data-kind="sleep">🌙 睡眠</button><button data-kind="medication">💊 用藥</button><button data-kind="exercise">🏃 運動</button><button data-kind="focus">🧠 專注</button></div><div id="sleep-fields"><label>事件</label><div class="tabs"><button data-sleep="躺">躺</button><button class="selected" data-sleep="睡">睡</button><button data-sleep="起">起</button></div></div><div id="medication-fields" hidden><label>藥物</label><select id="drug"><option>利他能</option><option>專思達</option><option>安保美喜</option><option>其他</option></select><div class="grid"><div><label>每顆 mg</label><input id="mg" type="number" min="0.1" step="any" value="10"></div><div><label>顆數</label><input id="tabs" type="number" min="0.25" step="0.25" value="1"></div></div></div><div id="exercise-fields" hidden><label>運動</label><select id="exercise"><option>走路／跑步</option><option>游泳</option><option>跳繩</option><option>重量訓練</option><option>其他</option></select><label>分鐘</label><input id="minutes" type="number" min="1" value="25"></div><div id="focus-fields" hidden><label>專注度 0–10</label><input id="focus" type="number" min="0" max="10" value="5"></div><label>發生時間</label><input id="state-time" type="datetime-local"><label>備註（選填）</label><textarea id="note"></textarea><button id="save-state" class="primary wide">儲存 State</button></div></section>
<section id="work" hidden><div class="card"><h2>工作（附加功能）</h2><p class="sub">本機計時，尚未與 Mac 同步</p><label>專案</label><input id="project" value="一般工作"><p id="current-work" class="status">目前沒有工作計時</p><div class="grid"><button data-work="交通">交通</button><button data-work="會議">會議</button><button data-work="創作">創作</button><button data-work="製作">製作</button></div><button id="stop" class="wide">結束工作</button></div><div class="card"><h2>手動補登</h2><label>分類</label><select id="work-type"><option>交通</option><option>會議</option><option>創作</option><option>製作</option><option>其他</option></select><label>開始</label><input id="work-start" type="datetime-local"><label>結束</label><input id="work-end" type="datetime-local"><button id="manual" class="wide">補登工作</button></div></section>
<section id="records" hidden><div class="card"><div class="line"><h2>本機紀錄</h2><span class="sub" id="count"></span></div><div id="entries"></div></div><div class="card"><h2>備份</h2><p class="sub">資料只存在這台裝置的瀏覽器，尚未同步 Google Sheets。請定期匯出。</p><button id="export" class="wide">下載 JSON 備份</button><button id="csv" class="wide">下載 CSV</button></div></section><p class="sub">測試版 · 目前不會修改既有 PPL 歷史資料</p></main>
<script>(function(){'use strict';var KEY='ppl_iphone_v13',records=[],active=null,kind='sleep',sleep='睡',ok=true;function E(x){return document.getElementById(x)}function dateInput(t){var d=new Date(t),p=function(n){return String(n).padStart(2,'0')};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())}function iso(v){var d=new Date(v);return isFinite(d.getTime())?d.toISOString():null}function id(){return 'ppl-'+Date.now()+'-'+Math.random().toString(36).slice(2)}function status(s){E('status').textContent=s}function save(){try{localStorage.setItem(KEY,JSON.stringify({records:records,active:active}))}catch(e){ok=false;status('⚠ 本機儲存失敗，請勿輸入正式資料')}}function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function tab(t){['state','work','records'].forEach(function(x){E(x).hidden=x!==t});document.querySelectorAll('[data-tab]').forEach(function(b){b.classList.toggle('selected',b.dataset.tab===t)});if(t==='records')render()}function changeKind(k){kind=k;['sleep','medication','exercise','focus'].forEach(function(x){E(x+'-fields').hidden=x!==k});document.querySelectorAll('[data-kind]').forEach(function(b){b.classList.toggle('selected',b.dataset.kind===k)})}function refresh(){E('current-work').textContent=active?'目前：'+active.activity+' · '+active.project:'目前沒有工作計時'}function close(t){if(active){active.end=t;records.push(active);active=null}}function work(activity){var t=new Date().toISOString();close(t);active={id:id(),type:'work',activity:activity,project:E('project').value||'一般工作',start:t,source:'iphone',sync:'pending'};save();refresh();status('✓ 已開始 '+activity+'（本機）')}function state(){var t=iso(E('state-time').value);if(!t){alert('請選擇有效時間');return}var value,qty=null,mg=null,detail={};if(kind==='sleep')value=sleep;else if(kind==='medication'){value=E('drug').value;qty=Number(E('tabs').value);var strength=Number(E('mg').value);if(!(qty>0&&strength>0)){alert('請確認劑量與顆數');return}mg=qty*strength;detail.strength_mg=strength}else if(kind==='exercise'){value=E('exercise').value;qty=Number(E('minutes').value);if(!(qty>0)){alert('請輸入分鐘數');return}detail.unit='minutes'}else{value='專注度';qty=Number(E('focus').value);if(!isFinite(qty)||qty<0||qty>10){alert('請輸入 0–10');return}}records.push({id:id(),type:'state',kind:kind,value:value,quantity:qty,dose_mg:mg,details:detail,at:t,note:E('note').value,source:'iphone',sync:'pending'});save();status('✓ 已儲存 '+value+'（本機）');E('note').value='';E('state-time').value=dateInput(Date.now())}function manual(){var a=iso(E('work-start').value),b=iso(E('work-end').value);if(!a||!b||b<=a){alert('起訖時間不正確');return}var overlap=records.some(function(r){return r.type==='work'&&new Date(a)<new Date(r.end)&&new Date(b)>new Date(r.start)})||(active&&new Date(a)<new Date()&&new Date(b)>new Date(active.start));if(overlap){alert('與既有工作重疊，請先核對');return}records.push({id:id(),type:'work',activity:E('work-type').value,project:E('project').value||'一般工作',start:a,end:b,source:'iphone_manual',sync:'pending'});save();status('✓ 已補登工作')}function render(){var all=records.slice();if(active)all.push(active);all.sort(function(a,b){return new Date(b.start||b.at)-new Date(a.start||a.at)});E('count').textContent=all.length+' 筆';E('entries').innerHTML=all.slice(0,100).map(function(r){return '<div class="item"><b>'+esc(r.activity||r.value)+'</b><div class="sub">'+esc(new Date(r.start||r.at).toLocaleString('zh-TW'))+' · '+esc(r.type==='work'?'工作':'State')+'</div></div>'}).join('')||'<p class="sub">尚無紀錄</p>'}function download(name,text,type){var url=URL.createObjectURL(new Blob([text],{type:type})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},1500)}try{var d=JSON.parse(localStorage.getItem(KEY)||'{}');records=Array.isArray(d.records)?d.records:[];active=d.active||null}catch(e){ok=false}document.querySelectorAll('[data-tab]').forEach(function(b){b.addEventListener('click',function(){tab(b.dataset.tab)})});document.querySelectorAll('[data-kind]').forEach(function(b){b.addEventListener('click',function(){changeKind(b.dataset.kind)})});document.querySelectorAll('[data-sleep]').forEach(function(b){b.addEventListener('click',function(){sleep=b.dataset.sleep;document.querySelectorAll('[data-sleep]').forEach(function(x){x.classList.toggle('selected',x===b)})})});document.querySelectorAll('[data-work]').forEach(function(b){b.addEventListener('click',function(){work(b.dataset.work)})});E('drug').addEventListener('change',function(){E('mg').value={'利他能':10,'專思達':36,'安保美喜':10}[this.value]||''});E('save-state').addEventListener('click',state);E('stop').addEventListener('click',function(){if(!active){status('目前沒有工作計時');return}close(new Date().toISOString());save();refresh();status('✓ 工作已結束')});E('manual').addEventListener('click',manual);E('export').addEventListener('click',function(){download('ppl_backup.json',JSON.stringify({schema:'ppl-iphone-v1.3',records:records,active:active},null,2),'application/json')});E('csv').addEventListener('click',function(){var cols=['id','type','kind','activity','value','quantity','dose_mg','project','start','end','at','note','source','sync'];var rows=[cols].concat(records.map(function(r){return cols.map(function(c){return r[c]||''})}));download('ppl_events.csv','\ufeff'+rows.map(function(row){return row.map(function(x){return '"'+String(x).replace(/"/g,'""')+'"'}).join(',')}).join('\r\n'),'text/csv;charset=utf-8')});E('state-time').value=dateInput(Date.now());E('work-start').value=dateInput(Date.now()-3600000);E('work-end').value=dateInput(Date.now());changeKind('sleep');tab('state');refresh();status(ok?'✓ 操作程式已啟動 · State 優先':'⚠ 本機儲存不可用');})();</script></body></html>
