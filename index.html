<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/><title>PPL iPhone v1.7</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#243247;font:16px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:520px;margin:auto;padding:22px 16px 60px}h1{margin:3px 0 15px;font-size:26px}h2{font-size:19px}.sub{font-size:12px;color:#718096}.card{background:#fff;border:1px solid #e1e8f0;border-radius:17px;padding:17px;margin:14px 0;box-shadow:0 2px 9px #2030400a}.tabs,.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid{grid-template-columns:repeat(2,1fr)}button{font:inherit;border:1px solid #d7e1ec;border-radius:12px;background:#f7faff;color:#254362;padding:14px 8px;cursor:pointer;touch-action:manipulation}button.selected,.primary{background:#3171b9;color:#fff;border-color:#3171b9}button:active{opacity:.65}.score-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.score-grid button{padding:13px 2px}.chart-key{display:flex;gap:16px;font-size:12px;color:#5b6f84}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.chart-wrap{overflow-x:auto}#trend{width:100%;min-width:300px;height:230px}.grid button{min-height:58px}label{display:block;margin:12px 0 5px;font-size:13px;color:#5b6f84}input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #d4dfe9;font:16px -apple-system,sans-serif;background:#fff;color:#263548}textarea{min-height:65px}.wide{width:100%;margin-top:14px}.status{border-radius:10px;background:#e7f1fc;padding:11px;font-size:13px;color:#285785}.item{padding:12px 0;border-bottom:1px solid #edf0f4}.item:last-child{border:0}[hidden]{display:none!important}.line{display:flex;justify-content:space-between;gap:10px;align-items:center}
.tabs.top-tabs{grid-template-columns:repeat(4,minmax(0,1fr))}.top-tabs button{font-size:12px;padding:12px 3px}
</style></head><body><main><div class="sub">PERSONAL PERFORMANCE LAB · v1.7</div><h1>PPL iPhone</h1><div class="status" id="status">正在啟動…</div><div class="tabs top-tabs" style="margin-top:14px"><button class="selected" data-tab="state">State</button><button data-tab="work">工作</button><button data-tab="records">紀錄</button><button data-tab="dashboard">State Dashboard</button></div>
<section id="state"><div class="card"><h2>快速記錄</h2><div class="grid"><button data-kind="medication">💊 藥</button><button data-kind="combined">☕ 物／其他</button><button data-kind="focus">🧠 專注</button><button data-kind="anxiety">📈 焦慮</button><button data-kind="sleep">🌙 睡眠</button><button data-kind="exercise">🏃 運動</button></div><div id="sleep-fields"><label>事件</label><div class="tabs"><button data-sleep="躺">躺</button><button class="selected" data-sleep="睡">睡</button><button data-sleep="起">起</button></div></div><div hidden="" id="medication-fields"><label>藥物</label><select id="drug"><option>利他能</option><option>專思達</option><option>安保美喜</option><option>其他</option></select><div class="grid"><div><label>每顆 mg</label><input id="mg" min="0.1" step="any" type="number" value="10"/></div><div><label>顆數</label><input id="tabs" min="0.25" step="0.25" type="number" value="1"/></div></div></div><div hidden="" id="exercise-fields"><label>運動</label><select id="exercise"><option>走路／跑步</option><option>游泳</option><option>跳繩</option><option>重量訓練</option><option>其他</option></select><label>分鐘</label><input id="minutes" min="1" type="number" value="25"/></div><div hidden="" id="focus-fields"><label>專注度（0–9）</label><div class="score-grid" id="focus-scores"></div><input id="focus" type="hidden" value="5"/></div><div hidden="" id="anxiety-fields"><label>焦慮程度（0–9，0 為無焦慮）</label><div class="score-grid" id="anxiety-scores"></div><input id="anxiety" type="hidden" value="5"/></div><div hidden="" id="combined-fields"><label>選擇記錄類型</label><div class="grid"><button class="selected" data-combined="substance">物質</button><button data-combined="other">其他</button></div><div hidden="" id="substance-fields"><label>物質種類</label><select id="substance"><option>咖啡因</option><option>酒精</option><option>尼古丁</option><option>其他</option></select><label>數量（選填）</label><input id="substance-qty" min="0" placeholder="例如 1" step="any" type="number"/></div><div hidden="" id="other-fields"><label>事件名稱</label><input id="other-value" placeholder="輸入事件名稱"/></div></div><label>發生時間</label><input id="state-time" type="datetime-local"/><label>備註（選填）</label><textarea id="note"></textarea><button class="primary wide" id="save-state">儲存 State</button></div></section>
<section hidden="" id="work"><div class="card"><h2>工作（附加功能）</h2><p class="sub">本機計時，尚未與 Mac 同步</p><label>專案</label><input id="project" value="一般工作"/><p class="status" id="current-work">目前沒有工作計時</p><div class="grid"><button data-work="交通">交通</button><button data-work="會議">會議</button><button data-work="創作">創作</button><button data-work="製作">製作</button></div><button class="wide" id="stop">結束工作</button></div><div class="card"><h2>手動補登</h2><label>分類</label><select id="work-type"><option>交通</option><option>會議</option><option>創作</option><option>製作</option><option>其他</option></select><label>開始</label><input id="work-start" type="datetime-local"/><label>結束</label><input id="work-end" type="datetime-local"/><button class="wide" id="manual">補登工作</button></div></section>
<section hidden="" id="records"><div class="card"><div class="line"><h2>本機紀錄</h2><span class="sub" id="count"></span></div><div id="entries"></div></div><div class="card"><h2>備份</h2><p class="sub">資料只存在這台裝置的瀏覽器，尚未自動同步 Google Sheets。請定期匯出；可將 JSON 備份傳回 ChatGPT 協助匯入 PPL。</p><button class="wide" id="export">下載 JSON 備份</button><button class="wide" id="csv">下載 CSV</button></div></section><section hidden="" id="dashboard"><div class="card"><h2>專注與焦慮趨勢</h2><div class="chart-key"><span><i class="dot" style="background:#3171b9"></i>專注</span><span><i class="dot" style="background:#e27651"></i>焦慮</span></div><div class="chart-wrap"><svg aria-label="專注與焦慮時間趨勢圖" id="trend" role="img" viewbox="0 0 340 230"></svg></div><p class="sub">顯示最近 7 天本機紀錄；各筆依實際時間定位，兩種評分不必同時輸入。</p></div></section><p class="sub">測試版 · 目前不會修改既有 PPL 歷史資料</p></main>
<script>(function(){'use strict';var KEY='ppl_iphone_v13',records=[],active=null,kind='medication',sleep='睡',ok=true;function E(x){return document.getElementById(x)}function dateInput(t){var d=new Date(t),p=function(n){return String(n).padStart(2,'0')};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())}function iso(v){var d=new Date(v);return isFinite(d.getTime())?d.toISOString():null}function id(){return 'ppl-'+Date.now()+'-'+Math.random().toString(36).slice(2)}function status(s){E('status').textContent=s}function save(){try{var raw=JSON.stringify({records:records,active:active});localStorage.setItem(KEY,raw);if(localStorage.getItem(KEY)!==raw)throw Error('readback mismatch');return true}catch(e){ok=false;status('⚠ 本機儲存失敗，請立即匯出備份');return false}}function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function tab(t){['state','work','records','dashboard'].forEach(function(x){E(x).hidden=x!==t});document.querySelectorAll('[data-tab]').forEach(function(b){b.classList.toggle('selected',b.dataset.tab===t)});if(t==='records')render();if(t==='dashboard')renderTrend()}function changeKind(k){kind=k==='combined'?'substance':k;['sleep','medication','exercise','focus','anxiety'].forEach(function(x){E(x+'-fields').hidden=x!==kind});E('combined-fields').hidden=k!=='combined';E('substance-fields').hidden=kind!=='substance';E('other-fields').hidden=kind!=='other';document.querySelectorAll('[data-kind]').forEach(function(b){b.classList.toggle('selected',b.dataset.kind===k)});document.querySelectorAll('[data-combined]').forEach(function(b){b.classList.toggle('selected',b.dataset.combined===kind)})}function refresh(){E('current-work').textContent=active?'目前：'+active.activity+' · '+active.project:'目前沒有工作計時'}function close(t){if(active){active.end=t;records.push(active);active=null}}function work(activity){var t=new Date().toISOString();close(t);active={id:id(),type:'work',activity:activity,project:E('project').value||'一般工作',start:t,source:'iphone',sync:'pending'};save();refresh();status('✓ 已開始 '+activity+'（本機）')}function state(){var t=iso(E('state-time').value);if(!t){alert('請選擇有效時間');return}var value,qty=null,mg=null,detail={};if(kind==='sleep')value=sleep;else if(kind==='medication'){value=E('drug').value;qty=Number(E('tabs').value);var strength=Number(E('mg').value);if(!(qty>0&&strength>0)){alert('請確認劑量與顆數');return}mg=qty*strength;detail.strength_mg=strength}else if(kind==='exercise'){value=E('exercise').value;qty=Number(E('minutes').value);if(!(qty>0)){alert('請輸入分鐘數');return}detail.unit='minutes'}else if(kind==='focus'||kind==='anxiety'){value=kind==='focus'?'專注度':'焦慮';qty=Number(E(kind).value);if(!Number.isInteger(qty)||qty<0||qty>9){alert('請輸入 0–9');return}}else if(kind==='substance'){value=E('substance').value;var q=E('substance-qty').value.trim();qty=q===''?null:Number(q);if(q!==''&&(!isFinite(qty)||qty<0)){alert('請確認數量');return}}else if(kind==='other'){value=E('other-value').value.trim();if(!value){alert('請輸入事件名稱');return}}var item={id:id(),type:'state',kind:kind,value:value,quantity:qty,dose_mg:mg,details:detail,at:t,note:E('note').value,source:'iphone',sync:'pending'};var duplicate=records.some(function(r){return r.type==='state'&&r.kind===item.kind&&r.value===item.value&&r.quantity===item.quantity&&r.at===item.at});if(duplicate&&!confirm('相同時間、種類與數值已有紀錄。仍要再新增一筆嗎？'))return;records.push(item);if(!save()){records.pop();return}status('✓ 已儲存：'+display(item)+'（僅本機）');E('note').value='';E('state-time').value=dateInput(Date.now());renderTrend();var b=E('save-state');b.disabled=true;setTimeout(function(){b.disabled=false},900)}function manual(){var a=iso(E('work-start').value),b=iso(E('work-end').value);if(!a||!b||b<=a){alert('起訖時間不正確');return}var overlap=records.some(function(r){return r.type==='work'&&new Date(a)<new Date(r.end)&&new Date(b)>new Date(r.start)})||(active&&new Date(a)<new Date()&&new Date(b)>new Date(active.start));if(overlap){alert('與既有工作重疊，請先核對');return}records.push({id:id(),type:'work',activity:E('work-type').value,project:E('project').value||'一般工作',start:a,end:b,source:'iphone_manual',sync:'pending'});save();status('✓ 已補登工作')}function display(r){if(r.type==='work')return (r.activity||'工作')+' · '+(r.project||'');if(r.kind==='focus')return '專注度 '+r.quantity+'/9';if(r.kind==='anxiety')return '焦慮 '+r.quantity+'/9';if(r.kind==='medication')return r.value+' '+r.quantity+' 顆 · '+r.dose_mg+' mg';if(r.kind==='exercise')return r.value+' '+r.quantity+' 分鐘';if(r.kind==='sleep')return '睡眠 · '+r.value;if(r.kind==='substance')return '物質 · '+r.value+(r.quantity==null?'':' · '+r.quantity);return r.value||'State'}function render(){var all=records.slice();if(active)all.push(active);all.sort(function(a,b){return new Date(b.start||b.at)-new Date(a.start||a.at)});E('count').textContent=all.length+' 筆';E('entries').innerHTML=all.slice(0,100).map(function(r){return '<div class="item"><b>'+esc(display(r))+'</b><div class="sub">'+esc(new Date(r.start||r.at).toLocaleString('zh-TW'))+' · '+esc(r.type==='work'?'工作':'State')+' · '+esc(r.sync||'未同步')+'</div>'+(r.note?'<div class="sub">'+esc(r.note)+'</div>':'')+'</div>'}).join('')||'<p class="sub">尚無紀錄</p>'}function scoreButtons(k){var el=E(k+'-scores');for(var i=0;i<=9;i++){(function(n){var b=document.createElement('button');b.type='button';b.textContent=n;b.addEventListener('click',function(){E(k).value=n;Array.from(el.children).forEach(function(x){x.classList.toggle('selected',x===b)})});el.appendChild(b)})(i)}el.children[5].classList.add('selected')}function renderTrend(){var svg=E('trend');if(!svg)return;var now=Date.now(),min=now-7*86400000;var pts=records.filter(function(r){return r.type==='state'&&(r.kind==='focus'||r.kind==='anxiety')&&isFinite(+r.quantity)&&+r.quantity>=0&&+r.quantity<=9&&new Date(r.at).getTime()>=min&&new Date(r.at).getTime()<=now}).sort(function(a,b){return new Date(a.at)-new Date(b.at)});var left=34,right=330,top=12,bottom=194;var x=function(t){return left+(t-min)/(now-min)*(right-left)},y=function(v){return bottom-v/9*(bottom-top)};var out='';for(var i=0;i<=9;i+=3){var yy=y(i);out+='<line x1="'+left+'" x2="'+right+'" y1="'+yy+'" y2="'+yy+'" stroke="#e5ebf3"/><text x="24" y="'+(yy+4)+'" text-anchor="end" fill="#75859b" font-size="11">'+i+'</text>'}for(var d=0;d<=7;d++){var xx=left+d/7*(right-left);var dt=new Date(min+d*86400000);out+='<text x="'+xx+'" y="214" text-anchor="middle" fill="#75859b" font-size="10">'+(dt.getMonth()+1)+'/'+dt.getDate()+'</text>'}['focus','anxiety'].forEach(function(k){var a=pts.filter(function(p){return p.kind===k}),color=k==='focus'?'#3171b9':'#e27651';if(a.length>1)out+='<polyline fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round" points="'+a.map(function(p){return x(new Date(p.at).getTime())+','+y(+p.quantity)}).join(' ')+'"/>';a.forEach(function(p){out+='<circle cx="'+x(new Date(p.at).getTime())+'" cy="'+y(+p.quantity)+'" r="4" fill="'+color+'"><title>'+ (k==='focus'?'專注':'焦慮')+' '+p.quantity+' · '+new Date(p.at).toLocaleString('zh-TW')+'</title></circle>'})});if(!pts.length)out+='<text x="170" y="106" text-anchor="middle" fill="#8493a5" font-size="13">最近 7 天尚無評分</text>';svg.innerHTML=out}function download(name,text,type){var url=URL.createObjectURL(new Blob([text],{type:type})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},1500)}try{var d=JSON.parse(localStorage.getItem(KEY)||'{}');records=Array.isArray(d.records)?d.records:[];active=d.active||null}catch(e){ok=false}document.querySelectorAll('[data-tab]').forEach(function(b){b.addEventListener('click',function(){tab(b.dataset.tab)})});document.querySelectorAll('[data-kind]').forEach(function(b){b.addEventListener('click',function(){changeKind(b.dataset.kind)})});document.querySelectorAll('[data-combined]').forEach(function(b){b.addEventListener('click',function(){changeKind('combined');kind=b.dataset.combined;E('substance-fields').hidden=kind!=='substance';E('other-fields').hidden=kind!=='other';document.querySelectorAll('[data-combined]').forEach(function(x){x.classList.toggle('selected',x===b)})})});document.querySelectorAll('[data-sleep]').forEach(function(b){b.addEventListener('click',function(){sleep=b.dataset.sleep;document.querySelectorAll('[data-sleep]').forEach(function(x){x.classList.toggle('selected',x===b)})})});document.querySelectorAll('[data-work]').forEach(function(b){b.addEventListener('click',function(){work(b.dataset.work)})});E('go-work').addEventListener('click',function(){tab('work')});scoreButtons('focus');scoreButtons('anxiety');E('drug').addEventListener('change',function(){E('mg').value={'利他能':10,'專思達':36,'安保美喜':10}[this.value]||''});E('save-state').addEventListener('click',state);E('stop').addEventListener('click',function(){if(!active){status('目前沒有工作計時');return}close(new Date().toISOString());save();refresh();status('✓ 工作已結束')});E('manual').addEventListener('click',manual);E('export').addEventListener('click',function(){download('ppl_backup.json',JSON.stringify({schema:'ppl-iphone-v1.6',records:records,active:active},null,2),'application/json')});E('csv').addEventListener('click',function(){var cols=['id','type','kind','activity','value','quantity','dose_mg','project','start','end','at','note','source','sync'];var rows=[cols].concat(records.map(function(r){return cols.map(function(c){return r[c]||''})}));download('ppl_events.csv','\ufeff'+rows.map(function(row){return row.map(function(x){return '"'+String(x).replace(/"/g,'""')+'"'}).join(',')}).join('\r\n'),'text/csv;charset=utf-8')});E('state-time').value=dateInput(Date.now());E('work-start').value=dateInput(Date.now()-3600000);E('work-end').value=dateInput(Date.now());changeKind('medication');tab('state');refresh();status(ok?'✓ 本機記錄可用 · Google 自動同步尚未設定':'⚠ 本機儲存不可用');})();</script></body></html>
