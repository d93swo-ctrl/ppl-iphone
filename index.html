<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PPL iPhone v1.9</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#243247;font:16px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:520px;margin:auto;padding:22px 16px 65px}h1{font-size:26px;margin:4px 0 15px}h2{font-size:19px}.sub{font-size:12px;color:#718096}.card{background:#fff;border:1px solid #e1e8f0;border-radius:17px;padding:17px;margin:14px 0;box-shadow:0 2px 9px #2030400a}.tabs,.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}button{font:inherit;border:1px solid #d7e1ec;border-radius:12px;background:#f7faff;color:#254362;padding:14px 8px;cursor:pointer;touch-action:manipulation}button.selected,.primary{background:#4475b8;color:white;border-color:#4475b8}.grid button{min-height:58px}button:active{opacity:.75}button:disabled{opacity:.55}label{display:block;margin:12px 0 5px;font-size:13px;color:#5b6f84}input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #d4dfe9;font:16px -apple-system,sans-serif;background:#fff;color:#263548}textarea{min-height:65px}.wide{width:100%;margin-top:14px}.status{border-radius:10px;background:#e7f1fc;padding:11px;font-size:13px;color:#285785}.item{padding:12px 0;border-bottom:1px solid #edf0f4}.item:last-child{border:0}[hidden]{display:none!important}.line{display:flex;justify-content:space-between;gap:10px;align-items:center}.chart-key{display:flex;gap:16px;font-size:12px;color:#5b6f84}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.chart-wrap{overflow-x:auto}#trend{width:100%;min-width:300px;height:230px}
</style></head><body><main><div class="sub">PERSONAL PERFORMANCE LAB · v1.9</div><h1>PPL iPhone</h1><div class="status" id="status">正在啟動…</div><div class="tabs" style="margin-top:14px"><button class="selected" data-tab="state">State</button><button data-tab="work">工作</button><button data-tab="records">紀錄</button></div>
<section id="state"><div class="card"><h2>快速記錄</h2><div class="grid"><button data-kind="medication">💊 藥</button><button data-kind="combined">☕ 物／其他</button><button data-kind="focus">🧠 專注</button><button data-kind="anxiety">📈 焦慮</button><button data-kind="sleep">🌙 睡眠</button><button data-kind="exercise">🏃 運動</button></div>
<div id="sleep-fields" hidden><label>事件</label><div class="tabs"><button data-sleep="躺">躺</button><button class="selected" data-sleep="睡">睡</button><button data-sleep="起">起</button></div></div>
<div id="medication-fields"><label>藥物</label><select id="drug"><option>利他能</option><option>專思達</option><option>安保美喜</option><option>其他</option></select><div class="grid"><div><label>每顆 mg</label><input id="mg" type="number" min="0.1" step="any" value="10"></div><div><label>顆數</label><input id="tabs" type="number" min="0.25" step="0.25" value="1"></div></div></div>
<div id="exercise-fields" hidden><label>運動</label><select id="exercise"><option>走路／跑步</option><option>游泳</option><option>跳繩</option><option>重量訓練</option><option>其他</option></select><label>分鐘</label><input id="minutes" type="number" min="1" value="25"></div>
<div id="focus-fields" hidden><label for="focus">專注度（1–9）</label><select id="focus" aria-label="專注度 1 到 9"></select></div>
<div id="anxiety-fields" hidden><label for="anxiety">焦慮程度（1–9，1 為最低）</label><select id="anxiety" aria-label="焦慮程度 1 到 9"></select></div>
<div id="combined-fields" hidden><label>選擇記錄類型</label><div class="grid"><button class="selected" data-combined="substance">物質</button><button data-combined="other">其他</button></div><div id="substance-fields"><label>物質種類</label><select id="substance"><option>咖啡因</option><option>酒精</option><option>尼古丁</option><option>其他</option></select><label>數量（選填）</label><input id="substance-qty" type="number" min="0" step="any" placeholder="例如 1"></div><div id="other-fields" hidden><label>事件名稱</label><input id="other-value" placeholder="輸入事件名稱"></div></div>
<div id="state-time-fields"><label>發生時間</label><input id="state-time" type="datetime-local"></div><label>備註（選填）</label><textarea id="note"></textarea><button class="primary wide" id="save-state">儲存 State</button></div></section>
<section id="work" hidden><div class="card"><h2>工作（附加功能）</h2><p class="sub">本機計時，尚未與 Mac 同步</p><label>專案</label><input id="project" value="一般工作"><p class="status" id="current-work">目前沒有工作計時</p><div class="grid"><button data-work="交通">交通</button><button data-work="會議">會議</button><button data-work="創作">創作</button><button data-work="製作">製作</button></div><button class="wide" id="stop">結束工作</button></div><div class="card"><h2>手動補登</h2><label>分類</label><select id="work-type"><option>交通</option><option>會議</option><option>創作</option><option>製作</option><option>其他</option></select><label>開始</label><input id="work-start" type="datetime-local"><label>結束</label><input id="work-end" type="datetime-local"><button class="wide" id="manual">補登工作</button></div></section>
<section id="records" hidden><div class="card"><div class="line"><h2>本機紀錄</h2><span class="sub" id="count"></span></div><div id="entries"></div></div><div class="card"><h2>專注與焦慮趨勢</h2><div class="chart-key"><span><i class="dot" style="background:#3171b9"></i>專注</span><span><i class="dot" style="background:#e27651"></i>焦慮</span></div><div class="chart-wrap"><svg id="trend" viewBox="0 0 340 230" role="img" aria-label="專注與焦慮時間趨勢圖"></svg></div><p class="sub">最近 7 天本機紀錄，依自動記錄時間繪製。</p></div><div class="card"><h2>Google Sheets 同步（測試）</h2><p class="sub">同步金鑰只儲存在目前瀏覽器，不會上傳 GitHub。儲存後將嘗試自動傳送；只有收到伺服器確認才標示已同步。</p><label>同步金鑰</label><input id="sync-token" type="password" autocomplete="off" placeholder="貼上 Apps Script 指令碼屬性的 PPL_SYNC_TOKEN"><button class="wide" id="save-token">儲存同步設定</button><button class="wide primary" id="sync-now">立即同步待傳資料</button><p class="status" id="sync-status">尚未設定同步</p></div><div class="card"><h2>備份</h2><p class="sub">資料先儲存在這台裝置；同步未確認的紀錄仍須保留備份。請定期匯出。</p><button class="wide" id="export">下載 JSON 備份</button><button class="wide" id="csv">下載 CSV</button></div></section><p class="sub">測試版 · 目前不會修改既有 PPL 歷史資料</p></main>
<script>(function(){'use strict';const KEY='ppl_iphone_v13',E=id=>document.getElementById(id);let records=[],active=null,kind='medication',sleep='睡',storageOK=true;const pad=n=>String(n).padStart(2,'0');function dateInput(t){const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes())}function iso(v){const d=new Date(v);return isFinite(d.getTime())?d.toISOString():null}function uid(){return 'ppl-'+Date.now()+'-'+Math.random().toString(36).slice(2)}function status(s){E('status').textContent=s}function save(){try{const raw=JSON.stringify({records,active});localStorage.setItem(KEY,raw);if(localStorage.getItem(KEY)!==raw)throw Error('readback mismatch');return true}catch(e){storageOK=false;status('⚠ 本機儲存失敗，請匯出備份');return false}}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function tab(t){['state','work','records'].forEach(x=>E(x).hidden=x!==t);document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('selected',b.dataset.tab===t));if(t==='records'){render();renderTrend()}}function changeKind(k){kind=k==='combined'?'substance':k;['sleep','medication','exercise','focus','anxiety'].forEach(x=>E(x+'-fields').hidden=x!==kind);E('combined-fields').hidden=k!=='combined';E('substance-fields').hidden=kind!=='substance';E('other-fields').hidden=kind!=='other';E('state-time-fields').hidden=kind==='focus'||kind==='anxiety';document.querySelectorAll('[data-kind]').forEach(b=>b.classList.toggle('selected',b.dataset.kind===k));document.querySelectorAll('[data-combined]').forEach(b=>b.classList.toggle('selected',b.dataset.combined===kind))}function refresh(){E('current-work').textContent=active?'目前：'+active.activity+' · '+active.project:'目前沒有工作計時'}function close(t){if(active){active.end=t;records.push(active);active=null}}function work(activity){const t=new Date().toISOString(),oldRecords=records.slice(),oldActive=active;close(t);active={id:uid(),type:'work',activity,project:E('project').value||'一般工作',start:t,source:'iphone',sync:'pending'};if(!save()){records=oldRecords;active=oldActive;return}refresh();status('✓ 已開始 '+activity+'（本機）')}function display(r){if(r.type==='work')return (r.activity||'工作')+' · '+(r.project||'');if(r.kind==='focus')return '專注度 '+r.quantity+'/9';if(r.kind==='anxiety')return '焦慮 '+r.quantity+'/9';if(r.kind==='medication')return r.value+' '+r.quantity+' 顆 · '+r.dose_mg+' mg';if(r.kind==='exercise')return r.value+' '+r.quantity+' 分鐘';if(r.kind==='sleep')return '睡眠 · '+r.value;if(r.kind==='substance')return '物質 · '+r.value+(r.quantity==null?'':' · '+r.quantity);return r.value||'State'}function state(){const t=(kind==='focus'||kind==='anxiety')?new Date().toISOString():iso(E('state-time').value);if(!t){alert('請選擇有效時間');return}let value,qty=null,mg=null,detail={};if(kind==='sleep')value=sleep;else if(kind==='medication'){value=E('drug').value;qty=Number(E('tabs').value);const strength=Number(E('mg').value);if(!(qty>0&&strength>0)){alert('請確認劑量與顆數');return}mg=qty*strength;detail.strength_mg=strength}else if(kind==='exercise'){value=E('exercise').value;qty=Number(E('minutes').value);if(!(qty>0)){alert('請輸入分鐘數');return}detail.unit='minutes'}else if(kind==='focus'||kind==='anxiety'){value=kind==='focus'?'專注度':'焦慮';qty=Number(E(kind).value);if(!Number.isInteger(qty)||qty<1||qty>9){alert('請選擇 1–9');return}}else if(kind==='substance'){value=E('substance').value;const q=E('substance-qty').value.trim();qty=q===''?null:Number(q);if(q!==''&&(!isFinite(qty)||qty<0)){alert('請確認數量');return}}else if(kind==='other'){value=E('other-value').value.trim();if(!value){alert('請輸入事件名稱');return}}const item={id:uid(),type:'state',kind,value,quantity:qty,dose_mg:mg,details:detail,at:t,note:E('note').value,source:'iphone',sync:'pending'};const duplicate=records.some(r=>r.type==='state'&&r.kind===item.kind&&r.value===item.value&&r.quantity===item.quantity&&Math.abs(new Date(r.at)-new Date(item.at))<60000);if(duplicate&&!confirm('一分鐘內已有相同種類與數值的紀錄，仍要新增嗎？'))return;records.push(item);if(!save()){records.pop();return}status('✓ 已儲存：'+display(item)+'（本機；嘗試同步）');queueSync();E('note').value='';E('state-time').value=dateInput(Date.now());const b=E('save-state');b.disabled=true;setTimeout(()=>b.disabled=false,900)}function manual(){const a=iso(E('work-start').value),b=iso(E('work-end').value);if(!a||!b||b<=a){alert('起訖時間不正確');return}const overlap=records.some(r=>r.type==='work'&&r.end&&new Date(a)<new Date(r.end)&&new Date(b)>new Date(r.start))||(active&&new Date(a)<new Date()&&new Date(b)>new Date(active.start));if(overlap){alert('與既有工作重疊，請先核對');return}records.push({id:uid(),type:'work',activity:E('work-type').value,project:E('project').value||'一般工作',start:a,end:b,source:'iphone_manual',sync:'pending'});if(!save()){records.pop();return}status('✓ 已補登工作');queueSync()}function render(){const all=records.slice();if(active)all.push(active);all.sort((a,b)=>new Date(b.start||b.at)-new Date(a.start||a.at));E('count').textContent=all.length+' 筆';E('entries').innerHTML=all.slice(0,100).map(r=>'<div class="item"><b>'+esc(display(r))+'</b><div class="sub">'+esc(new Date(r.start||r.at).toLocaleString('zh-TW'))+' · '+esc(r.type==='work'?'工作':'State')+' · '+esc(r.sync||'未同步')+'</div>'+(r.note?'<div class="sub">'+esc(r.note)+'</div>':'')+'</div>').join('')||'<p class="sub">尚無紀錄</p>'}function renderTrend(){const svg=E('trend'),now=Date.now(),min=now-7*86400000;const pts=records.filter(r=>r.type==='state'&&(r.kind==='focus'||r.kind==='anxiety')&&isFinite(+r.quantity)&&+r.quantity>=0&&+r.quantity<=9&&new Date(r.at).getTime()>=min&&new Date(r.at).getTime()<=now).sort((a,b)=>new Date(a.at)-new Date(b.at));const left=34,right=330,top=12,bottom=194,x=t=>left+(t-min)/(now-min)*(right-left),y=v=>bottom-v/9*(bottom-top);let out='';for(let i=0;i<=9;i+=3){const yy=y(i);out+='<line x1="'+left+'" x2="'+right+'" y1="'+yy+'" y2="'+yy+'" stroke="#e5ebf3"/><text x="24" y="'+(yy+4)+'" text-anchor="end" fill="#75859b" font-size="11">'+i+'</text>'}for(let d=0;d<=7;d++){const xx=left+d/7*(right-left),dt=new Date(min+d*86400000);out+='<text x="'+xx+'" y="214" text-anchor="middle" fill="#75859b" font-size="10">'+(dt.getMonth()+1)+'/'+dt.getDate()+'</text>'}['focus','anxiety'].forEach(k=>{const a=pts.filter(p=>p.kind===k),color=k==='focus'?'#3171b9':'#e27651';if(a.length>1)out+='<polyline fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round" points="'+a.map(p=>x(new Date(p.at).getTime())+','+y(+p.quantity)).join(' ')+'"/>';a.forEach(p=>out+='<circle cx="'+x(new Date(p.at).getTime())+'" cy="'+y(+p.quantity)+'" r="4" fill="'+color+'"><title>'+(k==='focus'?'專注':'焦慮')+' '+p.quantity+' · '+new Date(p.at).toLocaleString('zh-TW')+'</title></circle>')});if(!pts.length)out+='<text x="170" y="106" text-anchor="middle" fill="#8493a5" font-size="13">最近 7 天尚無評分</text>';svg.innerHTML=out}
const SYNC_URL='https://script.google.com/macros/s/AKfycbzgic8iJIPPJpC3pH4iGiHChuNw7-Qd9-8PrkdqbU5UFXNu3XHICrIYu0RI2hA6ajCj/exec';
const TOKEN_KEY='ppl_sync_token_v1';
const EXCLUDED_IDS=new Set(['ppl-1794487794700-29i8gaof34o','ppl-1794493110725-jriprtes6k']);
let syncing=false;
function syncMessage(message){E('sync-status').textContent=message}
async function syncNow(){
 if(syncing)return;
 const token=(localStorage.getItem(TOKEN_KEY)||'').trim();
 if(!token){syncMessage('請先輸入並儲存同步金鑰');return}
 const pending=records.filter(r=>r.id&&!EXCLUDED_IDS.has(r.id)&&r.sync!=='synced'&&(r.type==='state'||(r.type==='work'&&r.end))).slice(0,100);
 if(!pending.length){syncMessage('沒有待傳的已完成紀錄');return}
 syncing=true;syncMessage('傳送 '+pending.length+' 筆，等待伺服器確認…');
 try{
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);
  let response;
  try{response=await fetch(SYNC_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token,records:pending}),redirect:'follow',signal:controller.signal});}
  finally{clearTimeout(timer)}
  if(!response.ok)throw Error('HTTP '+response.status);
  const result=await response.json();
  if(!result.ok)throw Error(result.error||'伺服器拒絕同步');
  const confirmed=new Set([...(result.added||[]),...(result.skipped||[])].filter(id=>!EXCLUDED_IDS.has(id)));
  let count=0;
  records.forEach(r=>{if(confirmed.has(r.id)){r.sync='synced';count++}});
  if(count&&!save())throw Error('同步已到達伺服器，但本機狀態儲存失敗');
  syncMessage('✓ 伺服器確認 '+count+' 筆；待傳 '+records.filter(r=>r.sync!=='synced'&&!EXCLUDED_IDS.has(r.id)).length+' 筆');render();
 }catch(err){syncMessage('⚠ 尚未取得同步確認：'+String(err.message||err)+'。本機資料保留，請勿清除或重複新增。');}
 finally{syncing=false}
}
function queueSync(){if(localStorage.getItem(TOKEN_KEY))setTimeout(syncNow,100)}
function download(name,content,type){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}try{const d=JSON.parse(localStorage.getItem(KEY)||'{}');records=Array.isArray(d.records)?d.records:[];active=d.active||null}catch(e){storageOK=false}['focus','anxiety'].forEach(k=>{for(let i=1;i<=9;i++){const o=document.createElement('option');o.value=i;o.textContent=i+' 分';if(i===5)o.selected=true;E(k).appendChild(o)}});document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>tab(b.dataset.tab)));document.querySelectorAll('[data-kind]').forEach(b=>b.addEventListener('click',()=>changeKind(b.dataset.kind)));document.querySelectorAll('[data-combined]').forEach(b=>b.addEventListener('click',()=>{changeKind('combined');kind=b.dataset.combined;E('substance-fields').hidden=kind!=='substance';E('other-fields').hidden=kind!=='other';document.querySelectorAll('[data-combined]').forEach(x=>x.classList.toggle('selected',x===b))}));document.querySelectorAll('[data-sleep]').forEach(b=>b.addEventListener('click',()=>{sleep=b.dataset.sleep;document.querySelectorAll('[data-sleep]').forEach(x=>x.classList.toggle('selected',x===b))}));document.querySelectorAll('[data-work]').forEach(b=>b.addEventListener('click',()=>work(b.dataset.work)));E('drug').addEventListener('change',function(){E('mg').value={'利他能':10,'專思達':36,'安保美喜':10}[this.value]||''});E('save-state').addEventListener('click',state);E('stop').addEventListener('click',()=>{if(!active){status('目前沒有工作計時');return}const oldRecords=records.slice(),oldActive=active;close(new Date().toISOString());if(!save()){records=oldRecords;active=oldActive;return}refresh();status('✓ 工作已結束');queueSync()});E('manual').addEventListener('click',manual);E('export').addEventListener('click',()=>download('ppl_backup.json',JSON.stringify({schema:'ppl-iphone-v1.9',records,active},null,2),'application/json'));E('csv').addEventListener('click',()=>{const cols=['id','type','kind','activity','value','quantity','dose_mg','project','start','end','at','note','source','sync'];const rows=[cols].concat(records.map(r=>cols.map(c=>r[c]??'')));download('ppl_events.csv','\ufeff'+rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')});E('sync-token').value=localStorage.getItem(TOKEN_KEY)||'';E('save-token').addEventListener('click',()=>{const token=E('sync-token').value.trim();if(!token){syncMessage('金鑰不可空白');return}localStorage.setItem(TOKEN_KEY,token);syncMessage('已儲存金鑰於本機，準備同步');syncNow()});E('sync-now').addEventListener('click',syncNow);window.addEventListener('online',queueSync);document.addEventListener('visibilitychange',()=>{if(!document.hidden)queueSync()});E('state-time').value=dateInput(Date.now());E('work-start').value=dateInput(Date.now()-3600000);E('work-end').value=dateInput(Date.now());changeKind('medication');tab('state');refresh();status(storageOK?'✓ 本機記錄可用 · Google 自動同步尚未設定':'⚠ 本機儲存不可用');})();</script></body></html>
